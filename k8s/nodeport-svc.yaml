# NodePort svc — GKE Ingress 백엔드용. 기존 LoadBalancer svc (api-gateway) 는 그대로 두고 병행.
# DNS 가 새 IP 로 전환되고 HTTPS 가 안정화되면 옛 LB svc 는 삭제 가능.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-internal
  namespace: default
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
