apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  # maxSurge=0 — 새 Pod 띄우기 전에 OLD 먼저 죽임. memory 2Gi requests 라
  # 한 노드에 2개 동시 불가능 → maxSurge=1(기본) 이면 deadlock.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api-gateway
          image: asia-northeast3-docker.pkg.dev/trusta-market-id/trusta-registry-services/api-gateway:PLACEHOLDER
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
          # gateway 는 reactor netty 라 Tomcat thread 와 무관. request 는 실 사용량 기반.
          # limit 은 heap (limit*25%=500MB) + netty direct memory + 기타 = ~1.5GB 안에 맞춤.
          # request 줄임 → 노드당 pod 수 증가 → HPA scale 자리 확보 (e2-medium 4Gi 노드 기준 3 pod/노드).
          resources:
            requests:
              cpu: 100m
              memory: 800Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          # startupProbe — gateway 시작 시 issuer-uri 의 JWKS 가져옴. Keycloak 응답 변동 고려.
          # timeoutSeconds default 1초 → 부하 시 응답 1초 안 못 함 → fail → restart cycle. 3 으로 늘림.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          # 부하 중 한 번 응답 늦었다고 죽이지 않게 failureThreshold 늘림 (default 3 → 5).
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
